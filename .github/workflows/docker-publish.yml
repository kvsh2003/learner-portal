name: Build, Test and Push Docker Image

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: learner-api

jobs:
  build-test-push:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 1. Build locally first (Nothing is pushed yet)
      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          load: true
          push: false
          tags: laravel-ci:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 2. Test Apache configuration
      - name: Test Apache configuration
        run: |
          docker run --rm \
            laravel-ci:${{ github.sha }} \
            apache2ctl -t

      # 3. Test Laravel boot
      - name: Test Laravel boot
        run: |
          docker run --rm \
            -e APP_ENV=testing \
            -e LOG_CHANNEL=stderr \
            laravel-ci:${{ github.sha }} \
            php artisan --version

      # 4. Run Laravel Feature Tests (Assessment requirement)
      - name: Run Laravel Feature Tests
        run: |
          docker run --rm \
            -e APP_ENV=testing \
            -e APP_KEY="base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=" \
            -e DB_CONNECTION=sqlite \
            -e DB_DATABASE=:memory: \
            laravel-ci:${{ github.sha }} \
            php artisan test

      # 5. Start container for HTTP test
      - name: Start container for HTTP test
        run: |
          APP_KEY="base64:$(openssl rand -base64 32)"

          docker run -d \
            --name laravel-test \
            -p 127.0.0.1:8080:80 \
            -e APP_ENV=testing \
            -e APP_DEBUG=false \
            -e APP_KEY="$APP_KEY" \
            -e LOG_CHANNEL=stderr \
            -e SESSION_DRIVER=array \
            -e CACHE_STORE=array \
            -e QUEUE_CONNECTION=sync \
            laravel-ci:${{ github.sha }}

      # 6. Test HTTP health endpoint
      - name: Test HTTP health endpoint
        run: |
          for attempt in $(seq 1 30); do
            status="$(curl -s -o /dev/null -w '%{http_code}' \
              http://127.0.0.1:8080/up || true)"

            if [ "$status" = "200" ]; then
              echo "Laravel health check passed."
              exit 0
            fi

            echo "Waiting for Laravel... attempt $attempt"
            sleep 2
          done

          echo "Laravel health check failed."
          exit 1

      # 7. Show container logs on failure
      - name: Show container logs on failure
        if: failure()
        run: docker logs laravel-test || true

      # 8. Clean up test container
      - name: Remove test container
        if: always()
        run: docker rm -f laravel-test || true

      # 9. Login to Docker Hub (only on main branch push)
      - name: Login to Docker Hub
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 10. Tag and push tested image
      - name: Tag and push tested image
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          IMAGE="${DOCKERHUB_USERNAME}/${IMAGE_NAME}"

          docker tag laravel-ci:${{ github.sha }} "$IMAGE:latest"
          docker tag laravel-ci:${{ github.sha }} "$IMAGE:${{ github.sha }}"

          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"